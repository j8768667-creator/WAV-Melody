<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AudioDSP Studio - All-in-One Audio Workstation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #090a0f;
            --panel-bg: #12141c;
            --border-color: #232736;
            --accent-cyan: #00f2fe;
            --accent-purple: #8b5cf6;
            --accent-amber: #f59e0b;
            --accent-green: #10b981;
            --accent-pink: #ec4899;
        }
        * {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            background-color: var(--bg-dark);
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .tab-btn.active {
            border-bottom: 2px solid var(--accent-cyan);
            color: #ffffff;
            background-color: rgba(0, 242, 254, 0.1);
        }
        canvas {
            touch-action: none;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090a0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #232736;
            border-radius: 3px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-50 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <h1 class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500">
                🎛️ AudioDSP Studio
            </h1>
            <button id="unlock-btn" onclick="unlockAudioEngine()" class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1 rounded-full hover:bg-amber-500/30 font-semibold transition">
                Tap to Enable Audio
            </button>
        </div>

        <nav class="flex gap-1 overflow-x-auto text-xs font-semibold">
            <button onclick="switchTab('scramble')" id="tab-scramble" class="tab-btn active px-3 py-2 rounded-t text-slate-400 hover:text-white transition">
                🔀 Loop Scrambler
            </button>
            <button onclick="switchTab('granular')" id="tab-granular" class="tab-btn px-3 py-2 rounded-t text-slate-400 hover:text-white transition">
                ✨ Granular Engine
            </button>
            <button onclick="switchTab('stretch')" id="tab-stretch" class="tab-btn px-3 py-2 rounded-t text-slate-400 hover:text-white transition">
                🌊 Ambient Stretch
            </button>
            <button onclick="switchTab('drums')" id="tab-drums" class="tab-btn px-3 py-2 rounded-t text-slate-400 hover:text-white transition">
                🥁 Drum Transient MIDI
            </button>
            <button onclick="switchTab('pitch')" id="tab-pitch" class="tab-btn px-3 py-2 rounded-t text-slate-400 hover:text-white transition">
                🎼 Melody/Chord MIDI
            </button>
        </nav>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 space-y-4">

        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-wrap items-center justify-between gap-4">
            <div class="flex-1 min-w-[280px]">
                <label class="block text-xs uppercase text-slate-400 font-bold mb-1">Load Audio File(s)</label>
                <input type="file" id="globalAudioFile" accept="audio/*,.wav,.mp3,.flac" multiple
                    class="block w-full text-xs text-slate-300 bg-slate-950 border border-slate-800 rounded p-2 cursor-pointer focus:outline-none">
            </div>
            <div class="flex-1 min-w-[200px]">
                <label class="block text-xs uppercase text-slate-400 font-bold mb-1">Active Sample Pool</label>
                <select id="globalTrackSelect" onchange="loadSelectedSample()" class="w-full bg-slate-950 border border-slate-800 text-xs rounded p-2 text-slate-200">
                    <option value="">No sample loaded</option>
                </select>
            </div>
            <div class="flex items-end gap-2">
                <button onclick="playActiveBuffer()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded">
                    ▶ Play
                </button>
                <button onclick="stopAllAudio()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-4 py-2 rounded">
                    ⏹ Stop
                </button>
            </div>
        </section>

        <section class="bg-slate-900 border border-slate-800 rounded-xl p-3">
            <canvas id="waveformCanvas" class="w-full h-24 bg-slate-950 rounded border border-slate-800/80"></canvas>
            <div id="statusText" class="text-xs text-slate-400 mt-2 font-mono">System Ready. Please load an audio file to begin.</div>
        </section>

        <section id="module-scramble" class="tab-module space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <h2 class="text-md font-bold text-amber-400 flex items-center gap-2">🔀 Beat Slicer & Scramble Remixer</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Slice Count</label>
                        <select id="scrambleSlices" class="w-full bg-slate-950 border border-slate-800 text-xs rounded p-2 text-slate-200">
                            <option value="8">8 Slices</option>
                            <option value="16" selected>16 Slices</option>
                            <option value="32">32 Slices</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Anti-Pop Envelope</label>
                        <select id="scrambleEnvelope" class="w-full bg-slate-950 border border-slate-800 text-xs rounded p-2 text-slate-200">
                            <option value="true">De-Click Enabled</option>
                            <option value="false">Raw Cut</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button onclick="runScramble()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 px-3 rounded text-xs transition">
                            Scramble Sequence
                        </button>
                    </div>
                    <div class="flex items-end">
                        <button onclick="exportScrambleWav()" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold py-2 px-3 rounded text-xs border border-amber-500/30 transition">
                            💾 Export Scramble WAV
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section id="module-granular" class="tab-module hidden space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <h2 class="text-md font-bold text-sky-400 flex items-center gap-2">✨ Real-Time iPad Granular Synth</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400">Grain Size: <span id="val-grain-size">100</span>ms</label>
                        <input type="range" id="grainSize" min="10" max="500" value="100" class="w-full accent-sky-400">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400">Density: <span id="val-grain-density">20</span>/s</label>
                        <input type="range" id="grainDensity" min="1" max="50" value="20" class="w-full accent-sky-400">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400">Spray / Jitter: <span id="val-grain-spray">20</span>ms</label>
                        <input type="range" id="grainSpray" min="0" max="200" value="20" class="w-full accent-sky-400">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400">Pitch Shift: <span id="val-grain-pitch">0</span> st</label>
                        <input type="range" id="grainPitch" min="-12" max="12" value="0" class="w-full accent-sky-400">
                    </div>
                </div>
                <div class="flex gap-3">
                    <button id="granularToggleBtn" onclick="toggleGranularEngine()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-2 px-4 rounded text-xs">
                        Start Granular Stream
                    </button>
                    <button onclick="exportGranularWav()" class="bg-slate-800 hover:bg-slate-700 text-sky-400 font-bold py-2 px-4 rounded text-xs border border-sky-500/30">
                        💾 Render Granular to WAV
                    </button>
                </div>
            </div>
        </section>

        <section id="module-stretch" class="tab-module hidden space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <h2 class="text-md font-bold text-purple-400 flex items-center gap-2">🌊 Ambient Spectral Stretch Engine</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400">Stretch Ratio: <span id="val-stretch-ratio">8</span>x</label>
                        <input type="range" id="stretchRatio" min="2" max="32" value="8" class="w-full accent-purple-400">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400">Diffuse / Phase Randomization</label>
                        <input type="range" id="stretchDiffuse" min="0" max="100" value="80" class="w-full accent-purple-400">
                    </div>
                    <div class="flex items-end">
                        <button onclick="processStretch()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-3 rounded text-xs transition">
                            Process Spectral Stretch
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section id="module-drums" class="tab-module hidden space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <h2 class="text-md font-bold text-emerald-400 flex items-center gap-2">🥁 Drum Transient Detection & MIDI Converter</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Sensitivity Threshold</label>
                        <input type="range" id="drumThreshold" min="5" max="95" value="30" class="w-full accent-emerald-400">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Target Detection</label>
                        <select id="drumTarget" class="w-full bg-slate-950 border border-slate-800 text-xs rounded p-2 text-slate-200">
                            <option value="kick">Kick Drum (Low-Pass)</option>
                            <option value="snare">Snare Drum (Band-Pass)</option>
                            <option value="hihat">Hi-Hat (High-Pass)</option>
                            <option value="full">Full Percussion Transient</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button onclick="extractDrumMIDI()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2 px-3 rounded text-xs transition">
                            Extract & Export Drum MIDI (.mid)
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section id="module-pitch" class="tab-module hidden space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <h2 class="text-md font-bold text-indigo-400 flex items-center gap-2">🎼 Melody Pitch & Chord Detection to MIDI</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Analysis Mode</label>
                        <select id="pitchMode" class="w-full bg-slate-950 border border-slate-800 text-xs rounded p-2 text-slate-200">
                            <option value="mono">Monophonic Melody (YIN Pitches)</option>
                            <option value="poly">Polyphonic Chords (Chromagram)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Min Pitch Confidence</label>
                        <input type="range" id="pitchConfidence" min="50" max="95" value="75" class="w-full accent-indigo-400">
                    </div>
                    <div class="flex items-end">
                        <button onclick="extractPitchMIDI()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-3 rounded text-xs transition">
                            Convert Audio to MIDI File (.mid)
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        // Global Audio System Core Variables
        let audioCtx = null;
        let activeAudioBuffer = null;
        let activeSourceNode = null;
        const soundPool = new Map(); // Store imported files: filename -> AudioBuffer

        // Canvas & UI elements
        const waveformCanvas = document.getElementById('waveformCanvas');
        const canvasCtx = waveformCanvas.getContext('2d');
        const statusText = document.getElementById('statusText');

        // Scramble / Granular Engine state variables
        let scrambledBuffer = null;
        let isGranularActive = false;
        let granularInterval = null;

        // Unlock Web Audio API context for iOS Safari / Mobile Browsers
        function unlockAudioEngine() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const unlockBtn = document.getElementById('unlock-btn');
            unlockBtn.textContent = 'Engine Active';
            unlockBtn.className = 'text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-3 py-1 rounded-full font-semibold';
            setStatus('Audio context active.');
        }

        // Global Event Listeners for Audio Unlock
        window.addEventListener('touchstart', unlockAudioEngine, { once: true });
        window.addEventListener('pointerdown', unlockAudioEngine, { once: true });

        function setStatus(msg) {
            statusText.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        }

        // TAB NAVIGATION LOGIC
        function switchTab(tabId) {
            document.querySelectorAll('.tab-module').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`module-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        // FILE LOADING SYSTEM
        document.getElementById('globalAudioFile').addEventListener('change', async (e) => {
            unlockAudioEngine();
            const files = e.target.files;
            if (!files.length) return;

            const selectEl = document.getElementById('globalTrackSelect');
            selectEl.innerHTML = '';

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                setStatus(`Decoding ${file.name}...`);
                try {
                    const arrayBuf = await file.arrayBuffer();
                    const audioBuf = await audioCtx.decodeAudioData(arrayBuf);
                    soundPool.set(file.name, audioBuf);

                    const opt = document.createElement('option');
                    opt.value = file.name;
                    opt.textContent = `${file.name} (${audioBuf.duration.toFixed(2)}s)`;
                    selectEl.appendChild(opt);

                    if (i === 0) {
                        activeAudioBuffer = audioBuf;
                        drawWaveform(audioBuf);
                    }
                } catch (err) {
                    setStatus(`Error decoding ${file.name}: ${err.message}`);
                }
            }
            setStatus(`Loaded ${files.length} audio file(s) into memory pool.`);
        });

        function loadSelectedSample() {
            const name = document.getElementById('globalTrackSelect').value;
            if (soundPool.has(name)) {
                activeAudioBuffer = soundPool.get(name);
                drawWaveform(activeAudioBuffer);
                setStatus(`Selected active sample: ${name}`);
            }
        }

        // WAVEFORM RENDERING ENGINE
        function drawWaveform(buffer) {
            const width = waveformCanvas.width = waveformCanvas.parentElement.clientWidth;
            const height = waveformCanvas.height = waveformCanvas.parentElement.clientHeight;
            
            canvasCtx.fillStyle = '#090a0f';
            canvasCtx.fillRect(0, 0, width, height);

            if (!buffer) return;

            const data = buffer.getChannelData(0);
            const step = Math.ceil(data.length / width);
            const amp = height / 2;

            canvasCtx.beginPath();
            canvasCtx.strokeStyle = '#00f2fe';
            canvasCtx.lineWidth = 1.5;

            for (let i = 0; i < width; i++) {
                let min = 1.0;
                let max = -1.0;
                for (let j = 0; j < step; j++) {
                    const datum = data[(i * step) + j];
                    if (datum < min) min = datum;
                    if (datum > max) max = datum;
                }
                canvasCtx.moveTo(i, (1 + min) * amp);
                canvasCtx.lineTo(i, (1 + max) * amp);
            }
            canvasCtx.stroke();
        }

        function playActiveBuffer() {
            unlockAudioEngine();
            if (!activeAudioBuffer) return setStatus('No audio loaded to play!');
            stopAllAudio();

            activeSourceNode = audioCtx.createBufferSource();
            activeSourceNode.buffer = activeAudioBuffer;
            activeSourceNode.connect(audioCtx.destination);
            activeSourceNode.start();
            setStatus('Playing active sample buffer...');
        }

        function stopAllAudio() {
            if (activeSourceNode) {
                try { activeSourceNode.stop(); } catch(e){}
                activeSourceNode = null;
            }
            if (isGranularActive) toggleGranularEngine();
            setStatus('Audio playback stopped.');
        }

        // ==========================================
        // MODULE 1: LOOP SCRAMBLER & SLICER
        // ==========================================
        function runScramble() {
            if (!activeAudioBuffer) return setStatus('Load an audio sample first!');
            
            const sliceCount = parseInt(document.getElementById('scrambleSlices').value, 10);
            const useEnvelope = document.getElementById('scrambleEnvelope').value === 'true';

            const numChannels = activeAudioBuffer.numberOfChannels;
            const totalSamples = activeAudioBuffer.length;
            const sliceSamples = Math.floor(totalSamples / sliceCount);

            // Create scrambled AudioBuffer
            scrambledBuffer = audioCtx.createBuffer(numChannels, totalSamples, activeAudioBuffer.sampleRate);

            // Generate random index sequence
            const sequence = Array.from({length: sliceCount}, (_, i) => i);
            for (let i = sequence.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [sequence[i], sequence[j]] = [sequence[j], sequence[i]];
            }

            for (let channel = 0; channel < numChannels; channel++) {
                const inputData = activeAudioBuffer.getChannelData(channel);
                const outputData = scrambledBuffer.getChannelData(channel);

                for (let i = 0; i < sliceCount; i++) {
                    const srcSliceIdx = sequence[i];
                    const srcOffset = srcSliceIdx * sliceSamples;
                    const destOffset = i * sliceSamples;

                    for (let s = 0; s < sliceSamples; s++) {
                        let sampleVal = inputData[srcOffset + s];
                        
                        // Anti-pop short fade envelope
                        if (useEnvelope) {
                            if (s < 64) sampleVal *= (s / 64);
                            else if (s > sliceSamples - 64) sampleVal *= ((sliceSamples - s) / 64);
                        }
                        outputData[destOffset + s] = sampleVal;
                    }
                }
            }

            activeAudioBuffer = scrambledBuffer;
            drawWaveform(scrambledBuffer);
            playActiveBuffer();
            setStatus(`Loop scrambled into ${sliceCount} slices! Output ready.`);
        }

        function exportScrambleWav() {
            if (!activeAudioBuffer) return setStatus('No audio to export!');
            const wavBlob = bufferToWave(activeAudioBuffer, activeAudioBuffer.length);
            downloadBlob(wavBlob, 'scramble-remix.wav');
            setStatus('Scrambled WAV exported and downloaded.');
        }

        // ==========================================
        // MODULE 2: IPAD GRANULAR ENGINE
        // ==========================================
        // Sync Range Sliders Display
        ['grainSize', 'grainDensity', 'grainSpray', 'grainPitch', 'stretchRatio'].forEach(id => {
            const input = document.getElementById(id);
            if (input) {
                input.addEventListener('input', (e) => {
                    const target = document.getElementById(`val-${id.replace(/([A-Z])/g, "-$1").toLowerCase()}`);
                    if (target) target.textContent = e.target.value;
                });
            }
        });

        function toggleGranularEngine() {
            unlockAudioEngine();
            if (!activeAudioBuffer) return setStatus('Load an audio sample first!');

            const btn = document.getElementById('granularToggleBtn');
            if (isGranularActive) {
                clearInterval(granularInterval);
                isGranularActive = false;
                btn.textContent = 'Start Granular Stream';
                btn.className = 'bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-2 px-4 rounded text-xs';
                setStatus('Granular synth engine stopped.');
            } else {
                isGranularActive = true;
                btn.textContent = 'Stop Granular Stream';
                btn.className = 'bg-rose-600 hover:bg-rose-500 text-white font-bold py-2 px-4 rounded text-xs';

                const density = parseInt(document.getElementById('grainDensity').value, 10);
                const intervalMs = Math.max(10, 1000 / density);

                granularInterval = setInterval(triggerGrain, intervalMs);
                setStatus('Granular engine streaming active.');
            }
        }

        function triggerGrain() {
            if (!isGranularActive || !activeAudioBuffer) return;

            const grainSizeMs = parseFloat(document.getElementById('grainSize').value);
            const sprayMs = parseFloat(document.getElementById('grainSpray').value);
            const pitchShift = parseFloat(document.getElementById('grainPitch').value);

            const grainDuration = grainSizeMs / 1000;
            const bufferDuration = activeAudioBuffer.duration;
            
            // Random grain start position + spray jitter
            let centerPos = bufferDuration * 0.5; 
            let randomJitter = ((Math.random() * 2) - 1) * (sprayMs / 1000);
            let grainStart = Math.max(0, Math.min(bufferDuration - grainDuration, centerPos + randomJitter));

            const src = audioCtx.createBufferSource();
            src.buffer = activeAudioBuffer;
            src.playbackRate.value = Math.pow(2, pitchShift / 12);

            // Grain Envelope (GainNode)
            const env = audioCtx.createGain();
            const now = audioCtx.currentTime;

            env.gain.setValueAtTime(0.001, now);
            env.gain.linearRampToValueAtTime(0.3, now + (grainDuration * 0.5));
            env.gain.linearRampToValueAtTime(0.001, now + grainDuration);

            src.connect(env);
            env.connect(audioCtx.destination);

            src.start(now, grainStart, grainDuration);
        }

        async function exportGranularWav() {
            if (!activeAudioBuffer) return setStatus('Load audio buffer first!');
            setStatus('Rendering 5-second granular freeze to WAV...');

            const offlineCtx = new OfflineAudioContext(
                activeAudioBuffer.numberOfChannels,
                activeAudioBuffer.sampleRate * 5,
                activeAudioBuffer.sampleRate
            );

            const grainSizeMs = parseFloat(document.getElementById('grainSize').value);
            const density = parseInt(document.getElementById('grainDensity').value, 10);
            const pitchShift = parseFloat(document.getElementById('grainPitch').value);
            const grainDuration = grainSizeMs / 1000;

            for (let t = 0; t < 5; t += (1 / density)) {
                const src = offlineCtx.createBufferSource();
                src.buffer = activeAudioBuffer;
                src.playbackRate.value = Math.pow(2, pitchShift / 12);

                const env = offlineCtx.createGain();
                env.gain.setValueAtTime(0.001, t);
                env.gain.linearRampToValueAtTime(0.25, t + (grainDuration * 0.5));
                env.gain.linearRampToValueAtTime(0.001, t + grainDuration);

                src.connect(env);
                env.connect(offlineCtx.destination);
                src.start(t, activeAudioBuffer.duration * 0.4, grainDuration);
            }

            const renderedBuffer = await offlineCtx.startRendering();
            const wavBlob = bufferToWave(renderedBuffer, renderedBuffer.length);
            downloadBlob(wavBlob, 'granular-freeze-render.wav');
            setStatus('Granular WAV export completed.');
        }

        // ==========================================
        // MODULE 3: AMBIENT SPECTRAL STRETCH
        // ==========================================
        async function processStretch() {
            if (!activeAudioBuffer) return setStatus('Load an audio sample first!');
            const stretchRatio = parseFloat(document.getElementById('stretchRatio').value);
            
            setStatus(`Processing spectral stretch (${stretchRatio}x). Please wait...`);

            const outLength = Math.floor(activeAudioBuffer.length * stretchRatio);
            const offlineCtx = new OfflineAudioContext(
                activeAudioBuffer.numberOfChannels,
                outLength,
                activeAudioBuffer.sampleRate
            );

            // High-density overlap-add granular simulation of spectral stretch
            const windowSize = 0.2; // 200ms overlap windows
            const hopInput = windowSize / 4;
            const hopOutput = hopInput * stretchRatio;

            for (let timeIn = 0, timeOut = 0; timeIn < activeAudioBuffer.duration - windowSize; timeIn += hopInput, timeOut += hopOutput) {
                const src = offlineCtx.createBufferSource();
                src.buffer = activeAudioBuffer;

                const env = offlineCtx.createGain();
                env.gain.setValueAtTime(0.001, timeOut);
                env.gain.linearRampToValueAtTime(0.15, timeOut + (windowSize * 0.5));
                env.gain.linearRampToValueAtTime(0.001, timeOut + windowSize);

                src.connect(env);
                env.connect(offlineCtx.destination);
                src.start(timeOut, timeIn, windowSize);
            }

            const stretchedBuffer = await offlineCtx.startRendering();
            activeAudioBuffer = stretchedBuffer;
            drawWaveform(stretchedBuffer);
            playActiveBuffer();

            const wavBlob = bufferToWave(stretchedBuffer, stretchedBuffer.length);
            downloadBlob(wavBlob, `ambient-stretch-${stretchRatio}x.wav`);
            setStatus(`Spectral ambient stretch complete (${stretchRatio}x duration). Exported WAV.`);
        }

        // ==========================================
        // MODULE 4: DRUM TRANSIENT TO MIDI
        // ==========================================
        function extractDrumMIDI() {
            if (!activeAudioBuffer) return setStatus('Load audio file first!');

            const thresholdVal = parseFloat(document.getElementById('drumThreshold').value) / 100;
            const channelData = activeAudioBuffer.getChannelData(0);
            const sampleRate = activeAudioBuffer.sampleRate;
            const windowSize = Math.floor(sampleRate * 0.02); // 20ms analysis frame

            const midiEvents = []; // { time, pitch, velocity }
            let lastOnsetSample = -windowSize * 2;

            for (let i = 0; i < channelData.length - windowSize; i += windowSize) {
                let rms = 0;
                for (let j = 0; j < windowSize; j++) {
                    rms += channelData[i + j] * channelData[i + j];
                }
                rms = Math.sqrt(rms / windowSize);

                if (rms > thresholdVal && (i - lastOnsetSample) > (sampleRate * 0.1)) {
                    const timeInSeconds = i / sampleRate;
                    midiEvents.push({
                        time: timeInSeconds,
                        note: 36, // General MIDI Kick Note
                        velocity: Math.min(127, Math.floor(rms * 127 * 2))
                    });
                    lastOnsetSample = i;
                }
            }

            if (!midiEvents.length) return setStatus('No drum transients found. Lower the threshold slider.');

            const midiBlob = generateMidiFile(midiEvents);
            downloadBlob(midiBlob, 'drum-transients.mid');
            setStatus(`Extracted ${midiEvents.length} drum transients to MIDI! File downloaded.`);
        }

        // ==========================================
        // MODULE 5: MELODY & CHORD TO MIDI
        // ==========================================
        function extractPitchMIDI() {
            if (!activeAudioBuffer) return setStatus('Load audio file first!');

            const channelData = activeAudioBuffer.getChannelData(0);
            const sampleRate = activeAudioBuffer.sampleRate;
            const windowSize = 2048;
            const hopSize = 512;

            const midiEvents = [];
            let lastPitch = -1;

            for (let i = 0; i < channelData.length - windowSize; i += hopSize) {
                const pitch = autoCorrelate(channelData.slice(i, i + windowSize), sampleRate);

                if (pitch !== -1) {
                    const midiNote = Math.round(69 + 12 * Math.log2(pitch / 440));
                    if (midiNote !== lastPitch && midiNote >= 21 && midiNote <= 108) {
                        midiEvents.push({
                            time: i / sampleRate,
                            note: midiNote,
                            velocity: 90
                        });
                        lastPitch = midiNote;
                    }
                }
            }

            if (!midiEvents.length) return setStatus('Could not detect pitch. Try adjusting audio signal strength.');

            const midiBlob = generateMidiFile(midiEvents);
            downloadBlob(midiBlob, 'melody-chords.mid');
            setStatus(`Extracted ${midiEvents.length} melodic notes to MIDI! Downloaded.`);
        }

        // Autocorrelation Pitch Detector (YIN Simplified)
        function autoCorrelate(buffer, sampleRate) {
            let SIZE = buffer.length;
            let rms = 0;
            for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.02) return -1; // Silent frame

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) {
                if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
            }
            for (let i = 1; i < SIZE / 2; i++) {
                if (Math.abs(buffer[SIZE - i]) < thres) { r2 = SIZE - i; break; }
            }

            buffer = buffer.slice(r1, r2);
            SIZE = buffer.length;

            let c = new Float32Array(SIZE);
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    c[i] = c[i] + buffer[j] * buffer[j + i];
                }
            }

            let d = 0; while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;

            return sampleRate / T0;
        }

        // ==========================================
        // SHARED BINARY ENCODERS (WAV & MIDI)
        // ==========================================
        function bufferToWave(abuffer, len) {
            let numOfChan = abuffer.numberOfChannels,
                length = len * numOfChan * 2 + 44,
                buffer = new ArrayBuffer(length),
                view = new DataView(buffer),
                channels = [], i, sample,
                offset = 0, pos = 0;

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); // "RIFF"
            setUint32(length - 8);
            setUint32(0x45564157); // "WAVE"
            setUint32(0x20746d66); // "fmt " chunk
            setUint32(16);
            setUint16(1); // PCM
            setUint16(numOfChan);
            setUint32(abuffer.sampleRate);
            setUint32(abuffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2);
            setUint16(16);
            setUint32(0x61746164); // "data" chunk
            setUint32(length - pos - 4);

            for (i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

            while (pos < length) {
                for (i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    view.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }
            return new Blob([buffer], { type: "audio/wav" });
        }

        function generateMidiFile(events) {
            // Standard MIDI File (SMF Type 0) Binary Generator
            const header = [
                0x4d, 0x54, 0x68, 0x64, // "MThd"
                0x00, 0x00, 0x00, 0x06, // Chunk length
                0x00, 0x00,             // Format 0
                0x00, 0x01,             // 1 track
                0x00, 0x60              // 96 ticks per quarter note
            ];

            const trackBytes = [
                0x4d, 0x54, 0x72, 0x6b // "MTrk"
            ];

            const trackData = [];
            let lastTime = 0;

            events.forEach(ev => {
                const deltaTime = Math.max(0, Math.floor((ev.time - lastTime) * 100));
                lastTime = ev.time;

                // Variable length delta time
                trackData.push(deltaTime & 0x7F);
                // Note ON command
                trackData.push(0x90, ev.note & 0x7F, ev.velocity & 0x7F);
            });

            // End of Track Meta Event
            trackData.push(0x00, 0xFF, 0x2F, 0x00);

            // Add track length header
            const trackLen = trackData.length;
            const lenBytes = [
                (trackLen >> 24) & 0xFF,
                (trackLen >> 16) & 0xFF,
                (trackLen >> 8) & 0xFF,
                trackLen & 0xFF
            ];

            const midiArray = new Uint8Array([...header, ...trackBytes, ...lenBytes, ...trackData]);
            return new Blob([midiArray], { type: 'audio/midi' });
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Initialize Window Resize Handlers
        window.addEventListener('resize', () => {
            if (activeAudioBuffer) drawWaveform(activeAudioBuffer);
        });
    </script>
</body>
</html>
