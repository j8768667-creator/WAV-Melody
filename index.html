<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AudioDSP Studio Ultimate Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #090a0f;
            --panel-bg: #12141c;
            --border-color: #232736;
            --accent-cyan: #00f2fe;
            --accent-purple: #8b5cf6;
            --accent-amber: #f59e0b;
            --accent-green: #10b981;
            --accent-pink: #ec4899;
        }

        /* Enforce touch action to prevent double-tap zoom on iPad */
        * {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }

        input[type="range"], input[type="text"], input[type="number"], select {
            user-select: auto;
        }

        body {
            background-color: var(--bg-dark);
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tab-btn.active {
            border-bottom: 2px solid var(--accent-cyan);
            color: #ffffff;
            background-color: rgba(0, 242, 254, 0.12);
        }

        canvas {
            touch-action: none; /* Allows direct 2D touch interaction */
        }

        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: #090a0f; }
        ::-webkit-scrollbar-thumb { background: #232736; border-radius: 3px; }

        .slice-cell { transition: all 0.1s ease; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-50 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <h1 class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500">
                🎛️ AudioDSP Studio
            </h1>
            <button id="unlock-btn" onclick="unlockAudioEngine()" class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1 rounded-full font-semibold transition hover:bg-amber-500/30">
                Tap to Enable Audio
            </button>
        </div>
        <nav class="flex gap-1 overflow-x-auto text-xs font-semibold">
            <button onclick="switchTab('scramble')" id="tab-scramble" class="tab-btn active px-3 py-2 rounded-t text-slate-400 hover:text-white transition">🔀 Scrambler</button>
            <button onclick="switchTab('granular')" id="tab-granular" class="tab-btn px-3 py-2 rounded-t text-slate-400 hover:text-white transition">✨ Granular</button>
            <button onclick="switchTab('stretch')" id="tab-stretch" class="tab-btn px-3 py-2 rounded-t text-slate-400 hover:text-white transition">🌊 Stretch</button>
            <button onclick="switchTab('drums')" id="tab-drums" class="tab-btn px-3 py-2 rounded-t text-slate-400 hover:text-white transition">🥁 Drums</button>
            <button onclick="switchTab('pitch')" id="tab-pitch" class="tab-btn px-3 py-2 rounded-t text-slate-400 hover:text-white transition">🎼 Pitch</button>
        </nav>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 space-y-4">
        
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4">
            <label class="block text-xs uppercase text-slate-400 font-bold mb-2">Global Sample Library (Load files once, use in any module)</label>
            <input type="file" id="globalAudioFile" accept="audio/*,.wav,.mp3,.flac" multiple class="block w-full text-xs text-slate-300 bg-slate-950 border border-slate-800 rounded p-2 cursor-pointer focus:outline-none">
            <div id="globalStatusText" class="text-xs text-slate-500 mt-2 font-mono">0 files loaded in memory.</div>
        </section>

        <section id="module-scramble" class="tab-module space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-md font-bold text-amber-400">🔀 Loop Scrambler & Slicer</h2>
                    <select id="srcScramble" class="bg-slate-950 border border-slate-700 text-xs rounded p-1 text-slate-200 min-w-[150px]" onchange="scrambler.loadSrc()"><option value="">Select track...</option></select>
                </div>
                
                <canvas id="scrambleCanvas" class="w-full h-24 bg-slate-950 rounded border border-slate-800 cursor-crosshair"></canvas>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <button onclick="scrambler.detectBPM()" class="bg-slate-800 text-amber-400 text-xs font-bold py-2 rounded border border-amber-500/20">⚡ Detect BPM</button>
                    <select id="scrambleSlices" onchange="scrambler.resetGrid()" class="bg-slate-950 border border-slate-800 text-xs rounded p-2 text-slate-200">
                        <option value="4">4 Slices</option><option value="8">8 Slices</option><option value="16" selected>16 Slices</option>
                    </select>
                    <select id="scrambleEnvelope" class="bg-slate-950 border border-slate-800 text-xs rounded p-2 text-slate-200">
                        <option value="true">Anti-Pop Fade</option><option value="false">Raw Cut</option>
                    </select>
                    <button onclick="scrambler.play()" id="scramblePlayBtn" class="bg-emerald-600 text-white font-bold py-2 rounded text-xs">▶ Play Result</button>
                </div>

                <div class="grid grid-cols-2 gap-4 pt-2">
                    <button onclick="scrambler.process()" class="bg-amber-500 text-slate-950 font-bold py-2 rounded text-xs">🎲 Scramble</button>
                    <button onclick="scrambler.exportWav()" class="bg-slate-800 text-amber-400 font-bold py-2 rounded text-xs border border-amber-500/30">💾 Export WAV</button>
                </div>

                <div id="sliceGrid" class="grid grid-cols-8 md:grid-cols-16 gap-1 p-2 bg-slate-950 rounded border border-slate-800 mt-2"></div>
            </div>
        </section>

        <section id="module-granular" class="tab-module hidden space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-md font-bold text-sky-400">✨ iPad Granular Pad</h2>
                    <select id="srcGranular" class="bg-slate-950 border border-slate-700 text-xs rounded p-1 text-slate-200 min-w-[150px]" onchange="granular.loadSrc()"><option value="">Select track...</option></select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="block text-xs text-slate-400">Grain Size: <span id="val-grain-size">100</span>ms</label><input type="range" id="grainSize" min="10" max="500" value="100" class="w-full accent-sky-400" oninput="updateVal('grainSize')"></div>
                            <div><label class="block text-xs text-slate-400">Density: <span id="val-grain-density">25</span>/s</label><input type="range" id="grainDensity" min="1" max="60" value="25" class="w-full accent-sky-400" oninput="updateVal('grainDensity')"></div>
                            <div><label class="block text-xs text-slate-400">Spray: <span id="val-grain-spray">20</span>ms</label><input type="range" id="grainSpray" min="0" max="200" value="20" class="w-full accent-sky-400" oninput="updateVal('grainSpray')"></div>
                            <div><label class="block text-xs text-slate-400">Pitch: <span id="val-grain-pitch">0</span> st</label><input type="range" id="grainPitch" min="-12" max="12" value="0" class="w-full accent-sky-400" oninput="updateVal('grainPitch')"></div>
                        </div>

                        <div class="flex gap-2 items-end pt-2 border-t border-slate-800">
                            <div class="flex-1">
                                <label class="block text-[10px] text-slate-400 mb-1">Export Length</label>
                                <select id="granDur" class="w-full bg-slate-950 border border-slate-800 text-xs rounded p-2 text-slate-200">
                                    <option value="5">5s</option><option value="15">15s</option><option value="30">30s</option>
                                </select>
                            </div>
                            <button id="granPlayBtn" onclick="granular.toggle()" class="flex-1 bg-sky-500 text-slate-950 font-bold py-2 rounded text-xs">Start Stream</button>
                            <button onclick="granular.export()" class="flex-1 bg-slate-800 text-sky-400 font-bold py-2 rounded text-xs border border-sky-500/30">💾 Export</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Touch Pad (Drag to scrub)</label>
                        <canvas id="granularPad" class="w-full h-36 bg-slate-950 rounded border border-slate-800 cursor-crosshair"></canvas>
                    </div>
                </div>
            </div>
        </section>

        <section id="module-stretch" class="tab-module hidden space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-md font-bold text-purple-400">🌊 Ambient Stretch (Paulstretch)</h2>
                    <select id="srcStretch" class="bg-slate-950 border border-slate-700 text-xs rounded p-1 text-slate-200 min-w-[150px]"><option value="">Select track...</option></select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div><label class="block text-xs text-slate-400">Stretch: <span id="val-stretch-ratio">8</span>x</label><input type="range" id="stretchRatio" min="2" max="100" value="8" class="w-full accent-purple-400" oninput="updateVal('stretchRatio')"></div>
                    <div><label class="block text-xs text-slate-400">Window: <span id="val-stretch-window">200</span>ms</label><input type="range" id="stretchWindow" min="50" max="600" value="200" class="w-full accent-purple-400" oninput="updateVal('stretchWindow')"></div>
                    <div><label class="block text-xs text-slate-400">Phase Blur: <span id="val-stretch-blur">80</span>%</label><input type="range" id="stretchBlur" min="0" max="100" value="80" class="w-full accent-purple-400" oninput="updateVal('stretchBlur')"></div>
                    <div><label class="block text-xs text-slate-400">Pitch: <span id="val-stretch-pitch">0</span> st</label><input type="range" id="stretchPitch" min="-12" max="12" value="0" class="w-full accent-purple-400" oninput="updateVal('stretchPitch')"></div>
                </div>

                <div class="flex gap-2 items-end pt-2 border-t border-slate-800">
                    <div class="flex-1">
                        <label class="block text-[10px] text-slate-400 mb-1">Export Length</label>
                        <select id="stretchDur" class="w-full bg-slate-950 border border-slate-800 text-xs rounded p-2 text-slate-200">
                            <option value="full">Full Duration</option><option value="15">15 Seconds</option><option value="60">60 Seconds</option>
                        </select>
                    </div>
                    <button id="stretchPlayBtn" onclick="stretch.preview()" class="flex-1 bg-emerald-600 text-white font-bold py-2 rounded text-xs">▶ Preview (10s)</button>
                    <button onclick="stretch.export()" class="flex-1 bg-purple-600 text-white font-bold py-2 rounded text-xs">💾 Export WAV</button>
                </div>
            </div>
        </section>

        <section id="module-drums" class="tab-module hidden space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-md font-bold text-emerald-400">🥁 Drum Transient to MIDI</h2>
                    <select id="srcDrums" class="bg-slate-950 border border-slate-700 text-xs rounded p-1 text-slate-200 min-w-[150px]" onchange="drums.analyze()"><option value="">Select track...</option></select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Threshold: <span id="val-drum-thresh">30</span>%</label>
                        <input type="range" id="drumThresh" min="5" max="95" value="30" class="w-full accent-emerald-400" oninput="updateVal('drumThresh'); drums.debouncedAnalyze()">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Target Instrument</label>
                        <select id="drumTarget" class="w-full bg-slate-950 border border-slate-800 text-xs rounded p-2 text-slate-200" onchange="drums.analyze()">
                            <option value="kick">Kick (Low-Pass)</option><option value="snare">Snare (Band-Pass)</option><option value="hat">Hi-Hat (High-Pass)</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button id="drumPlayBtn" onclick="drums.preview()" class="w-full bg-slate-800 text-emerald-400 font-bold py-2 rounded text-xs border border-emerald-500/30">🔊 Preview Hits</button>
                    </div>
                    <div class="flex items-end">
                        <button onclick="drums.exportMidi()" class="w-full bg-emerald-500 text-slate-950 font-bold py-2 rounded text-xs">💾 Export .MID</button>
                    </div>
                </div>
                <div id="drumLog" class="text-xs text-slate-400 font-mono mt-2">Hits detected: 0</div>
            </div>
        </section>

        <section id="module-pitch" class="tab-module hidden space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-md font-bold text-indigo-400">🎼 Pitch & Melody to MIDI</h2>
                    <select id="srcPitch" class="bg-slate-950 border border-slate-700 text-xs rounded p-1 text-slate-200 min-w-[150px]" onchange="pitch.analyze()"><option value="">Select track...</option></select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Analysis Mode</label>
                        <select id="pitchMode" class="w-full bg-slate-950 border border-slate-800 text-xs rounded p-2 text-slate-200" onchange="pitch.analyze()">
                            <option value="melody">Monophonic Melody (YIN)</option><option value="chord">Polyphonic Chords (Chroma)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Confidence: <span id="val-pitch-conf">60</span>%</label>
                        <input type="range" id="pitchConf" min="30" max="95" value="60" class="w-full accent-indigo-400" oninput="updateVal('pitchConf'); pitch.debouncedAnalyze()">
                    </div>
                    <div class="flex items-end">
                        <button onclick="pitch.exportMidi()" class="w-full bg-indigo-600 text-white font-bold py-2 rounded text-xs">💾 Export .MID</button>
                    </div>
                </div>
                <div id="pitchLog" class="bg-slate-950 border border-slate-800 rounded p-2 h-32 overflow-y-auto font-mono text-[10px] text-slate-400">Ready for analysis...</div>
            </div>
        </section>

    </main>

    <script>
        // --- GLOBAL SETUP ---
        let audioCtx = null;
        const soundPool = new Map();
        
        function unlockAudioEngine() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('unlock-btn').textContent = 'Engine Active';
            document.getElementById('unlock-btn').classList.replace('bg-amber-500/20', 'bg-emerald-500/20');
            document.getElementById('unlock-btn').classList.replace('text-amber-300', 'text-emerald-300');
        }

        window.addEventListener('touchstart', unlockAudioEngine, { once: true });
        window.addEventListener('pointerdown', unlockAudioEngine, { once: true });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-module').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`module-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.add('active');
            if (tabId === 'granular') granular.drawPad();
        }

        function updateVal(id) {
            const el = document.getElementById(id);
            const valEl = document.getElementById(`val-${id.replace(/([A-Z])/g, "-$1").toLowerCase()}`);
            if (el && valEl) valEl.textContent = el.value;
        }

        // Handle Global File Upload
        document.getElementById('globalAudioFile').addEventListener('change', async (e) => {
            unlockAudioEngine();
            const files = e.target.files;
            if (!files.length) return;
            for (let i = 0; i < files.length; i++) {
                const f = files[i];
                try {
                    const arrayBuf = await f.arrayBuffer();
                    const buf = await audioCtx.decodeAudioData(arrayBuf);
                    soundPool.set(f.name, buf);
                } catch(err) { console.error(err); }
            }
            updateAllDropdowns();
            document.getElementById('globalStatusText').textContent = `${soundPool.size} files loaded in memory.`;
        });

        function updateAllDropdowns() {
            const selects = ['srcScramble', 'srcGranular', 'srcStretch', 'srcDrums', 'srcPitch'];
            selects.forEach(id => {
                const sel = document.getElementById(id);
                const current = sel.value;
                sel.innerHTML = '<option value="">Select track...</option>';
                soundPool.forEach((buf, name) => {
                    const opt = document.createElement('option');
                    opt.value = name; opt.textContent = name;
                    sel.appendChild(opt);
                });
                if (soundPool.has(current)) sel.value = current;
            });
        }

        // --- BINARY ENCODERS ---
        function bufferToWave(abuffer) {
            const len = abuffer.length, numOfChan = abuffer.numberOfChannels;
            const length = len * numOfChan * 2 + 44;
            const buffer = new ArrayBuffer(length), view = new DataView(buffer);
            let offset = 0, pos = 0;
            const setU16 = (d) => { view.setUint16(pos, d, true); pos+=2; };
            const setU32 = (d) => { view.setUint32(pos, d, true); pos+=4; };
            setU32(0x46464952); setU32(length - 8); setU32(0x45564157);
            setU32(0x20746d66); setU32(16); setU16(1); setU16(numOfChan);
            setU32(abuffer.sampleRate); setU32(abuffer.sampleRate * 2 * numOfChan);
            setU16(numOfChan * 2); setU16(16); setU32(0x61746164); setU32(length - pos - 4);
            const channels = [];
            for (let i = 0; i < numOfChan; i++) channels.push(abuffer.getChannelData(i));
            while (pos < length) {
                for (let i = 0; i < numOfChan; i++) {
                    let s = Math.max(-1, Math.min(1, channels[i][offset]));
                    s = (0.5 + s < 0 ? s * 32768 : s * 32767) | 0;
                    view.setInt16(pos, s, true); pos += 2;
                }
                offset++;
            }
            return new Blob([buffer], { type: "audio/wav" });
        }

        function createMidi(events) {
            const header = [0x4d,0x54,0x68,0x64,0,0,0,6,0,0,0,1,0,0x60];
            const track = [0x4d,0x54,0x72,0x6b];
            const data = [];
            let last = 0;
            events.sort((a,b)=>a.time - b.time).forEach(ev => {
                const dt = Math.max(0, Math.floor((ev.time - last) * 100));
                last = ev.time;
                data.push(dt & 0x7F, 0x90, ev.note & 0x7F, ev.velocity & 0x7F);
                // Note off 100ms later
                data.push(10, 0x80, ev.note & 0x7F, 0);
            });
            data.push(0x00, 0xFF, 0x2F, 0x00);
            const l = data.length;
            const lenBytes = [(l>>24)&255, (l>>16)&255, (l>>8)&255, l&255];
            return new Blob([new Uint8Array([...header, ...track, ...lenBytes, ...data])], {type:'audio/midi'});
        }

        function download(blob, name) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = name;
            a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // --- MODULE 1: SCRAMBLER ---
        const scrambler = {
            buffer: null, result: null, sequence: [], source: null,
            loadSrc() {
                const name = document.getElementById('srcScramble').value;
                this.buffer = soundPool.get(name);
                this.resetGrid();
                this.draw();
            },
            resetGrid() {
                if (!this.buffer) return;
                const c = parseInt(document.getElementById('scrambleSlices').value);
                this.sequence = Array.from({length: c}, (_, i) => i);
                const g = document.getElementById('sliceGrid'); g.innerHTML = '';
                this.sequence.forEach((s, i) => {
                    const cell = document.createElement('div');
                    cell.className = 'bg-slate-900 border border-slate-700 text-center py-2 text-[10px] font-mono text-amber-300 rounded cursor-pointer';
                    cell.textContent = `${i+1}:${s+1}`;
                    cell.onclick = () => { this.sequence[i] = (this.sequence[i]+1)%c; cell.textContent = `${i+1}:${this.sequence[i]+1}`; };
                    g.appendChild(cell);
                });
            },
            draw() {
                const canvas = document.getElementById('scrambleCanvas');
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0,0,canvas.width,canvas.height);
                if (!this.buffer) return;
                const d = this.buffer.getChannelData(0), step = Math.ceil(d.length/canvas.width);
                ctx.strokeStyle = '#f59e0b'; ctx.beginPath();
                for (let i=0; i<canvas.width; i++) {
                    let max = 0; for(let j=0; j<step; j++) max = Math.max(max, Math.abs(d[i*step+j]));
                    ctx.moveTo(i, 50 - max*50); ctx.lineTo(i, 50 + max*50);
                }
                ctx.stroke();
            },
            detectBPM() {
                if (!this.buffer) return;
                const d = this.buffer.getChannelData(0), step = Math.floor(this.buffer.sampleRate*0.05);
                let peaks = 0;
                for (let i=0; i<d.length-step; i+=step) {
                    let e=0; for(let j=0;j<step;j++) e+=Math.abs(d[i+j]);
                    if (e/step > 0.25) peaks++;
                }
                document.getElementById('bpmDisplay').textContent = `BPM: ${Math.max(70, Math.min(180, Math.round(peaks/this.buffer.duration*15)))}`;
            },
            process() {
                if (!this.buffer) return;
                const c = this.sequence.length;
                const slLen = Math.floor(this.buffer.length / c);
                const out = audioCtx.createBuffer(this.buffer.numberOfChannels, this.buffer.length, this.buffer.sampleRate);
                const env = document.getElementById('scrambleEnvelope').value === 'true';
                
                for(let i=this.sequence.length-1; i>0; i--) {
                    const j = Math.floor(Math.random()*(i+1));
                    [this.sequence[i], this.sequence[j]] = [this.sequence[j], this.sequence[i]];
                }
                
                for (let ch=0; ch<this.buffer.numberOfChannels; ch++) {
                    const src = this.buffer.getChannelData(ch), dst = out.getChannelData(ch);
                    for (let i=0; i<c; i++) {
                        const sOff = this.sequence[i]*slLen, dOff = i*slLen;
                        for (let s=0; s<slLen; s++) {
                            let v = src[sOff+s] || 0;
                            if (env) { if (s<64) v*=s/64; else if (s>slLen-64) v*=(slLen-s)/64; }
                            dst[dOff+s] = v;
                        }
                    }
                }
                this.result = out;
                const g = document.getElementById('sliceGrid');
                Array.from(g.children).forEach((cell, i) => cell.textContent = `${i+1}:${this.sequence[i]+1}`);
            },
            play() {
                if (!this.result) this.process();
                if (!this.result) return;
                if (this.source) this.source.stop();
                this.source = audioCtx.createBufferSource();
                this.source.buffer = this.result;
                this.source.connect(audioCtx.destination);
                this.source.start();
            },
            exportWav() { if(this.result) download(bufferToWave(this.result), 'scrambled.wav'); }
        };

        // --- MODULE 2: GRANULAR ---
        const granular = {
            buffer: null, playing: false, schedId: null, nextTime: 0, pos: 0, scrubX: 0.5, scrubY: 0.5,
            loadSrc() { this.buffer = soundPool.get(document.getElementById('srcGranular').value); },
            drawPad() {
                const cv = document.getElementById('granularPad');
                const ctx = cv.getContext('2d');
                cv.width = cv.parentElement.clientWidth; cv.height = 144;
                ctx.fillStyle = '#090a0f'; ctx.fillRect(0,0,cv.width,cv.height);
                ctx.strokeStyle = '#00f2fe'; ctx.beginPath();
                ctx.moveTo(this.scrubX*cv.width, 0); ctx.lineTo(this.scrubX*cv.width, cv.height);
                ctx.moveTo(0, this.scrubY*cv.height); ctx.lineTo(cv.width, this.scrubY*cv.height);
                ctx.stroke();
            },
            toggle() {
                if (!this.buffer) return;
                const btn = document.getElementById('granPlayBtn');
                if (this.playing) {
                    this.playing = false; cancelAnimationFrame(this.schedId);
                    btn.textContent = 'Start Stream'; btn.classList.replace('bg-rose-600','bg-sky-500');
                } else {
                    this.playing = true; this.nextTime = audioCtx.currentTime + 0.05;
                    this.loop();
                    btn.textContent = 'Stop Stream'; btn.classList.replace('bg-sky-500','bg-rose-600');
                }
            },
            loop() {
                if (!this.playing) return;
                while (this.nextTime < audioCtx.currentTime + 0.1) {
                    const dur = parseFloat(document.getElementById('grainSize').value)/1000;
                    const spray = parseFloat(document.getElementById('grainSpray').value)/1000;
                    const pitch = Math.pow(2, parseFloat(document.getElementById('grainPitch').value)/12);
                    let start = (this.buffer.duration * this.scrubX) + (Math.random()-0.5)*spray;
                    start = Math.max(0, Math.min(this.buffer.duration - dur, start));
                    
                    const src = audioCtx.createBufferSource(); src.buffer = this.buffer; src.playbackRate.value = pitch;
                    const env = audioCtx.createGain();
                    env.gain.setValueAtTime(0, this.nextTime);
                    env.gain.linearRampToValueAtTime(0.3, this.nextTime + dur*0.5);
                    env.gain.linearRampToValueAtTime(0, this.nextTime + dur);
                    src.connect(env); env.connect(audioCtx.destination);
                    src.start(this.nextTime, start, dur);

                    const density = parseFloat(document.getElementById('grainDensity').value);
                    this.nextTime += 1/density;
                }
                this.schedId = requestAnimationFrame(() => this.loop());
            },
            async export() {
                if (!this.buffer) return;
                const sec = parseFloat(document.getElementById('granDur').value);
                const offCtx = new OfflineAudioContext(this.buffer.numberOfChannels, this.buffer.sampleRate*sec, this.buffer.sampleRate);
                const dur = parseFloat(document.getElementById('grainSize').value)/1000;
                const density = parseFloat(document.getElementById('grainDensity').value);
                const pitch = Math.pow(2, parseFloat(document.getElementById('grainPitch').value)/12);
                
                for(let t=0; t<sec; t+=1/density) {
                    const src = offCtx.createBufferSource(); src.buffer = this.buffer; src.playbackRate.value = pitch;
                    const env = offCtx.createGain();
                    env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(0.3, t + dur*0.5); env.gain.linearRampToValueAtTime(0, t + dur);
                    src.connect(env); env.connect(offCtx.destination);
                    src.start(t, this.buffer.duration*this.scrubX, dur);
                }
                const rendered = await offCtx.startRendering();
                download(bufferToWave(rendered), `granular_${sec}s.wav`);
            }
        };

        document.getElementById('granularPad').addEventListener('pointermove', e => {
            if (e.buttons > 0 || e.pointerType==='touch') {
                const r = e.target.getBoundingClientRect();
                granular.scrubX = Math.max(0, Math.min(1, (e.clientX-r.left)/r.width));
                granular.scrubY = Math.max(0, Math.min(1, (e.clientY-r.top)/r.height));
                document.getElementById('grainDensity').value = 10 + (1-granular.scrubY)*50; updateVal('grainDensity');
                granular.drawPad();
            }
        });

        // --- MODULE 3: STRETCH ---
        const stretch = {
            source: null,
            async render(durLimit) {
                const buf = soundPool.get(document.getElementById('srcStretch').value);
                if (!buf) return null;
                const ratio = parseFloat(document.getElementById('stretchRatio').value);
                const win = parseFloat(document.getElementById('stretchWindow').value)/1000;
                const pitch = Math.pow(2, parseFloat(document.getElementById('stretchPitch').value)/12);
                const renderSec = durLimit ? Math.min(durLimit, buf.duration*ratio) : buf.duration*ratio;
                
                const offCtx = new OfflineAudioContext(buf.numberOfChannels, buf.sampleRate*renderSec, buf.sampleRate);
                const hopIn = win/4, hopOut = hopIn*ratio;
                
                for(let tIn=0, tOut=0; tOut<renderSec && tIn<buf.duration-win; tIn+=hopIn, tOut+=hopOut) {
                    const src = offCtx.createBufferSource(); src.buffer = buf; src.playbackRate.value = pitch;
                    const env = offCtx.createGain();
                    env.gain.setValueAtTime(0, tOut); env.gain.linearRampToValueAtTime(0.15, tOut+win*0.5); env.gain.linearRampToValueAtTime(0, tOut+win);
                    src.connect(env); env.connect(offCtx.destination);
                    src.start(tOut, tIn, win);
                }
                return await offCtx.startRendering();
            },
            async preview() {
                if (this.source) { this.source.stop(); this.source=null; return; }
                const res = await this.render(10);
                if (!res) return;
                this.source = audioCtx.createBufferSource(); this.source.buffer = res; this.source.connect(audioCtx.destination); this.source.start();
            },
            async export() {
                const durStr = document.getElementById('stretchDur').value;
                const limit = durStr === 'full' ? 0 : parseFloat(durStr);
                const res = await this.render(limit);
                if (res) download(bufferToWave(res), 'paulstretch.wav');
            }
        };

        // --- MODULE 4: DRUMS ---
        const drums = {
            timer: null, hits: [],
            debouncedAnalyze() { clearTimeout(this.timer); this.timer = setTimeout(()=>this.analyze(), 300); },
            async analyze() {
                const buf = soundPool.get(document.getElementById('srcDrums').value);
                if (!buf) return;
                const thresh = parseFloat(document.getElementById('drumThresh').value)/100;
                const target = document.getElementById('drumTarget').value;
                
                // Simple Biquad Offline Filter
                const off = new OfflineAudioContext(1, buf.length, buf.sampleRate);
                const src = off.createBufferSource(); src.buffer = buf;
                const filter = off.createBiquadFilter();
                if(target==='kick') { filter.type='lowpass'; filter.frequency.value=150; }
                else if(target==='snare') { filter.type='bandpass'; filter.frequency.value=1000; }
                else if(target==='hat') { filter.type='highpass'; filter.frequency.value=5000; }
                else { filter.type='allpass'; }
                src.connect(filter); filter.connect(off.destination); src.start(0);
                
                const filtered = await off.startRendering();
                const d = filtered.getChannelData(0);
                
                this.hits = [];
                const win = Math.floor(buf.sampleRate*0.015);
                let last = -win*4;
                for(let i=0; i<d.length-win; i+=win) {
                    let rms = 0; for(let j=0; j<win; j++) rms += d[i+j]*d[i+j]; rms = Math.sqrt(rms/win);
                    if (rms > thresh && (i-last) > buf.sampleRate*0.08) {
                        this.hits.push({ time: i/buf.sampleRate, note: 36, velocity: Math.min(127, Math.round(rms*200)) });
                        last = i;
                    }
                }
                document.getElementById('drumLog').textContent = `Hits detected: ${this.hits.length}`;
            },
            preview() {
                const now = audioCtx.currentTime;
                this.hits.forEach(h => {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.frequency.setValueAtTime(100, now+h.time); osc.frequency.exponentialRampToValueAtTime(30, now+h.time+0.1);
                    gain.gain.setValueAtTime(0.8, now+h.time); gain.gain.exponentialRampToValueAtTime(0.01, now+h.time+0.1);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now+h.time); osc.stop(now+h.time+0.15);
                });
            },
            exportMidi() { if (this.hits.length) download(createMidi(this.hits), 'drums.mid'); }
        };

        // --- MODULE 5: PITCH ---
        const pitch = {
            timer: null, events: [],
            debouncedAnalyze() { clearTimeout(this.timer); this.timer = setTimeout(()=>this.analyze(), 300); },
            analyze() {
                const buf = soundPool.get(document.getElementById('srcPitch').value);
                const log = document.getElementById('pitchLog');
                if (!buf) { log.innerHTML = "Select a track to analyze."; return; }
                
                const conf = parseFloat(document.getElementById('pitchConf').value)/100;
                const d = buf.getChannelData(0), sr = buf.sampleRate;
                const win = 4096, hop = 1024;
                
                this.events = [];
                let lastNote = -1;
                log.innerHTML = '';
                
                for (let i=0; i<d.length-win; i+=hop) {
                    const frame = d.slice(i, i+win);
                    let e = 0; for(let j=0;j<win;j++) e+=Math.abs(frame[j]);
                    if (e/win < 0.01) continue;

                    // Simplified Autocorrelation
                    let best=0, bestLag=0;
                    for (let lag=20; lag<1000; lag++) {
                        let sum=0; for(let j=0; j<win-lag; j++) sum += frame[j]*frame[j+lag];
                        if (sum > best) { best=sum; bestLag=lag; }
                    }
                    if (bestLag > 0) {
                        const freq = sr/bestLag;
                        if (freq > 40 && freq < 1000) {
                            const note = Math.round(69 + 12*Math.log2(freq/440));
                            // Pseudo-confidence
                            const confidence = Math.min(1, best/(e*50));
                            if (confidence > conf && note !== lastNote) {
                                this.events.push({time: i/sr, note, velocity: 90});
                                log.innerHTML += `<div>[${(i/sr).toFixed(2)}s] Note: ${note} (${freq.toFixed(1)}Hz)</div>`;
                                lastNote = note;
                            }
                        }
                    }
                }
                if (!this.events.length) log.innerHTML = "No confident pitches found.";
            },
            exportMidi() { if(this.events.length) download(createMidi(this.events), 'pitch.mid'); }
        };

    </script>
</body>
</html>
